<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    --ink: #0B0B0A;
    --panel: #171715;
    --steel: #3D3B3A;
    --paper: #F6F5EF;
    --phosphor: #E8A33D;
    --titlebar: #262421;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--ink);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Arial, Helvetica, sans-serif;
  }
  .term {
    width: 270px;
    background: rgba(23,23,21,0.9);
    backdrop-filter: blur(6px);
    border: 1px solid var(--steel);
    border-radius: 22px;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.55);
  }
  .titlebar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 14px 16px;
    background: var(--titlebar);
    border-bottom: 1px solid var(--steel);
  }
  .dot { width: 12px; height: 12px; border-radius: 50%; }
  .dot.red { background: #FF5F57; }
  .dot.yellow { background: #FEBC2E; }
  .dot.green { background: #28C840; }
  .titlebar-label {
    flex: 1;
    text-align: center;
    margin-right: 46px;
    font-family: "Courier New", monospace;
    font-size: 12.5px;
    color: #9c9994;
    letter-spacing: 0.03em;
  }
  .body { padding: 22px 20px; font-family: "Courier New", monospace; }
  .field { margin-bottom: 20px; }
  .field:last-child { margin-bottom: 0; }
  .key { color: #6a6864; font-size: 11px; letter-spacing: 0.1em; margin-bottom: 6px; }
  .val { color: var(--paper); font-size: 14px; }
  .val.status { color: var(--phosphor); display: flex; align-items: center; gap: 8px; }
  .pulse-dot {
    width: 7px; height: 7px; border-radius: 50%; background: var(--phosphor);
    box-shadow: 0 0 8px rgba(232,163,61,0.9);
    animation: pulse 1.8s ease-in-out infinite;
    flex-shrink: 0;
  }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
  .cursor {
    display: inline-block; width: 7px; height: 14px; background: var(--phosphor);
    margin-left: 2px; vertical-align: middle;
    animation: blink 1s step-end infinite;
  }
  @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
</style>
</head>
<body>
  <div class="term">
    <div class="titlebar">
      <div class="dot red"></div>
      <div class="dot yellow"></div>
      <div class="dot green"></div>
      <div class="titlebar-label">status</div>
    </div>
    <div class="body">
      <div class="field">
        <div class="key">STATUS</div>
        <div class="val status"><span class="pulse-dot"></span>AVAILABLE FOR PROJECTS</div>
      </div>
      <div class="field">
        <div class="key">LOCATION</div>
        <div class="val">SOUTH FLORIDA, USA</div>
      </div>
      <div class="field">
        <div class="key">RESPONSE</div>
        <div class="val">&lt; 24 HRS<span class="cursor"></span></div>
      </div>
    </div>
  </div>
</body>
</html>
